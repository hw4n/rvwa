name: Build Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_R2_IMAGE_BASE_URL: ${{ vars.NEXT_PUBLIC_R2_IMAGE_BASE_URL }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Collect build artifact
        run: |
          mkdir -p dist-artifacts
          artifact_paths=(.next package.json pnpm-lock.yaml next.config.ts)
          if [ -d public ]; then
            artifact_paths+=(public)
          fi
          if [ -d patches ]; then
            artifact_paths+=(patches)
          fi
          tar \
            --exclude='.next/cache' \
            --exclude='.next/dev' \
            -czf dist-artifacts/next-build.tar.gz \
            "${artifact_paths[@]}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: dist-artifacts/next-build.tar.gz
          if-no-files-found: error
          retention-days: 7
